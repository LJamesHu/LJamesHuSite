# Site
name: "James Hu"
title: "James Hu"
# description: "Jekyll Template for Blogging"
# meta_description: "Jekyll template, Medium styled, free for bloggers."
url: "https://LJamesHu.com"
baseurl: ""
repository: "LJamesHu/LJamesHuSite"
logo: 'assets/images/logo.png'
favicon: 'assets/images/logo.png'
google_analytics: 'UA-55715114-1'
disqus: 'ljameshu'
# mailchimp-list:

permalink: /:year/:month/:day/:title:output_ext

# Authors
authors:
  james:
    name: James
    display_name: James
    gravatar: e56154546cf4be74e393c62d1ae9f9d4
    email: contact@LJamesHu.com
    web: https://LJamesHu.com
    # twitter: https://twitter.com/wowthemesnet
    # description: "Author of Mediumish, a Bootstrap Medium styled template available for WordPress, HTML, Ghost and Jekyll. You are currently previewing Jekyll template demo."

# Plugins (GitHub Pages-supported allow-list only)
plugins:
  - jekyll-paginate
  - jekyll-sitemap

# Pagination (jekyll-paginate v1 — the only paginator GitHub Pages supports).
# Paginates blog/index.html: page 1 at /blog/, page 2+ at /blog/page2/ ...
paginate: 9
paginate_path: "/blog/page:num/"

# Other
markdown: kramdown
highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - LICENSE
  - vendor
  - .jekyll-cache
  - .sass-cache
